name: Playwright Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  schedule:
    - cron: "30 21 * * *"

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Preflight - Check application availability
        run: |
          curl -fI -L --max-time 30 https://dev.gobizify.in/
          curl -fI -L --max-time 30 https://dev-portal.gobizify.in/

      - name: Run Smoke tests
        if: github.event_name == 'pull_request'
        run: npm run test:smoke

      - name: Run Smoke and Sanity tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run test:smoke:sanity:crossbrowser

      - name: Run Nightly Regression tests
        if: github.event_name == 'schedule'
        run: npm run test:regression:all-browsers

      - name: Generate Allure report
        if: ${{ always() }}
        run: npm run allure:generate

      - name: Upload Playwright test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: Upload Allure report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30